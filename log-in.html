<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="logApp.js" defer></script>
    <title>Log in</title>
</head>
<body>
    <div class="homeButton">
        <a href="user-hompage-html.html" ><button type="button" class="btn btn-primary">Home</button></a>
        <button type="button" class="btn btn-success">Profile</button>
    </div>
    <div class="login-title">
        Log In
    </div>
    <div class="form-floating mb-3">
        <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
        <label for="floatingInput">Email address</label>
        </div>
        <div class="form-floating">
        <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
        <label for="floatingPassword">Password</label>
    </div>
    <div class="submitreset-buttons">
        <button type="button" class="btn btn-success btn-lg" id="submitButton">submit</button>
    </div>
    <div id="errorpopup">
        <p>Error when doing the password.</p>
        <p>Please ensure password is at least 6 characters long</p>
    </div>
</body>
</html>
